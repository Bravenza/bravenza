# ═══════════════════════════════════════════════════════════════════════════════
# Edge Function Authentication Governance (Fase 3 Hardening — Final)
#
# All functions use verify_jwt = false intentionally.
# JWT validation happens IN CODE via shared guards (_shared/auth-guard.ts).
# This avoids intermittent 401s from Supabase's signing-keys rotation system.
#
# Classification tiers:
#   PUBLIC    — No auth required; public data or external webhooks
#   SESSION   — CPF-based session_token auth (client portal)
#   AUTH      — JWT required via requireAuth / resolveAuthCpf / resolveCpf
#   ADMIN     — JWT + user_roles(admin) via requireAdmin / requireAdminByToken
#   SERVICE   — Service-role key / cron secret / admin fallback via requireServiceOrAdmin
#   MIXED     — Per-action classification (PUBLIC_ACTIONS + AUTH + ADMIN sets)
#
# See _shared/SECURITY.md § "verify_jwt Governance Matrix" for full justification.
# ═══════════════════════════════════════════════════════════════════════════════

# ── PUBLIC endpoints ──────────────────────────────────────────────────────────
# No sensitive data; intentionally open to the internet.

[functions.health-check]
verify_jwt = false
# PUBLIC — Uptime monitoring. No sensitive data exposed.

[functions.og-renderer]
verify_jwt = false
# PUBLIC — Open Graph meta tag renderer for link previews. Read-only public data.

[functions.push-vapid-key]
verify_jwt = false
# PUBLIC — Returns VAPID public key for push notification subscription. Public by design.

[functions.verify-captcha]
verify_jwt = false
# PUBLIC — reCAPTCHA token verification. Rate-limited (20/15min per IP). No auth needed.

[functions.verify-authenticity]
verify_jwt = false
# PUBLIC — Laudo/authenticity certificate lookup by QR code. Public read-only.

# ── WEBHOOK endpoints ─────────────────────────────────────────────────────────
# External service callbacks validated by signature, not JWT.

[functions.mercadopago-webhook]
verify_jwt = false
# WEBHOOK — Validated via HMAC-SHA256 signature (MP_WEBHOOK_SECRET). Not JWT-based.

# ── SESSION-based auth (client portal) ────────────────────────────────────────
# CPF + magic code → session_token, validated against client_sessions table.

[functions.client-auth]
verify_jwt = false
# SESSION — CPF magic-code auth flow. Validates session_token from client_sessions.

[functions.client-orders]
verify_jwt = false
# SESSION — Client portal order/notification queries. session_token auth (not JWT).

[functions.submit-review]
verify_jwt = false
# SESSION — Review submission. Validates session_token from client_sessions.

